<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Score Checker ni Rainzell-Imnida</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="box">
      <h1>Welcome to Rainzell's Score Checker</h1>
      <p>Click the button to start.</p>
      <button id="startBtn">Start</button>

      <div class="result">
        <p>Name: <span id="nameOutput">-</span></p>
        <p>Score: <span id="scoreOutput">-</span></p>
        <p>Remark: <span id="remarkOutput">-</span></p>
      </div>

      <div id="congrats" class="congrats">
        <h2 id="congratsText"> </h2>
        <img id="congratsImg" src="congrats.jpg" alt="Congratulations" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
